# Seed pillars for OpenSEO keyword research.
# The research agent expands each seed into long-tail candidates — these are
# starting points, not the final keyword list.

pillars:
  - name: accessibility
    seeds:
      - "text to speech for dyslexia"
      - "reading tool for dyslexia"
      - "listen instead of reading assistive technology"

      - "text to speech for ADHD"
      - "reading tool for ADHD"
      - "listen to textbooks with ADHD"
      - "ADHD study tools"

      - "text to speech for visual impairment"
      - "screen reader alternative"
      - "accessible reading software"

      - "text to speech for learning disabilities"
      - "assistive reading software"
      - "text to speech accessibility"

  - name: student_study_use
    seeds:
      - "convert pdf to audio to study"
      - "listen to lecture notes"
      - "audio textbook alternative"
      - "text to speech for studying"

  - name: document_conversion_howto
    seeds:
      - "convert docx to mp3"
      - "pdf to audio online free"
      - "how to listen to a pdf"

  - name: productivity_multitasking
    seeds:
      - "listen to documents while driving"
      - "listen to documents while commuting"
      - "consume documents faster"
      - "reduce screen time at work"
      - "review documents on the go"
      - "listen to reports instead of reading"
      - "how busy professionals consume long documents"
      - "multitask while reading documents"

  - name: competitor_alternatives
    seeds:
      - "Speechify alternative"
      - "NaturalReader vs Speechify"
      - "best text to speech app 2026"
      - "free text to speech tools compared"
      - "Invocly vs Speechify"
      - "cheap text to speech app for students"

  - name: case_studies
    seeds:
      - "how students study with audio"
      - "listening to textbooks instead of reading"
      - "studying with dyslexia"
      - "studying with ADHD"
      - "listening to documents at work"
      - "how professionals consume long documents"
      - "learning with audio instead of reading"
      - "real study workflows with AI"

